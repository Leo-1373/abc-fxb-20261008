# 短码字典 · 农户贷款风险防控
# 契约：IF-4.2。所有 rules.yaml 的 cond 表达式只能用本文件已定义的短码。
# 新增短码走李昊霖评审；禁止在 cond 里临时发明变量。
#
# 列定义： code | dim | 中文名 | 类型 | 取值/单位 | 计算口径
# 计算口径列写明"由哪来的、怎么算"，保证不同人实现出的数值可比。

version: 1.0.0
contract: v1

columns: code|dim|name|type|range|derivation

vars: |
  # ── dim=doc 资料核查 ────────────────────────────────────────────
  doc_miss_cnt|doc|缺件数|int|>=0|必备材料清单中缺失的项数
  doc_expired_cnt|doc|过期件数|int|>=0|证照/证明超出有效期的项数
  doc_inconsist_cnt|doc|不一致项数|int|>=0|跨材料同一事实矛盾处数（姓名/面积/金额/日期）
  id_valid|doc|证件有效|bool|0/1|身份证在有效期内且与申请人一致
  land_right_match|doc|权证与申报一致|bool|0/1|土地承包/经营权证面积与申报一致
  sign_complete|doc|签章完整|bool|0/1|合同/申请表签章齐全
  # ── 以下 23 个 doc 短码由真超奇在规则扩容时按需新增，已用于 R009-R038。
  #    契约 IF-4.2 规定新增短码需李昊霖评审；评审通过前请勿在其他 skill 的 cond 中引用。
  #    取值口径全部写在 skills/sk_doc/references/必备材料清单.md（§7 靶子、§8 脚本衔接）。
  doc_miss_redline_cnt|doc|缺准入要件数|int|>=0|缺失材料中命中清单「红线」列的项数
  doc_miss_identity_cnt|doc|身份类缺件数|int|>=0|类别=身份的缺失项数
  doc_miss_income_cnt|doc|收入类缺件数|int|>=0|类别=收入的缺失项数
  doc_miss_use_cnt|doc|用途类缺件数|int|>=0|类别=用途的缺失项数
  doc_miss_guarantee_cnt|doc|担保类缺件数|int|>=0|类别=担保的缺失项数
  doc_miss_biz_cnt|doc|经营类缺件数|int|>=0|类别=经营的缺失项数
  doc_miss_contract_cnt|doc|合同支付类缺件数|int|>=0|类别∈{合同,支付}的缺失项数
  doc_miss_postcheck_cnt|doc|检查类缺件数|int|>=0|类别=检查的缺失项数（贷后）
  doc_miss_archive_cnt|doc|归档类缺件数|int|>=0|类别=归档的缺失项数（贷后）
  doc_expired_key_cnt|doc|关键证照过期数|int|>=0|身份证/执照/防疫证/种畜禽证/水域滩涂证/特殊行业许可中已过期项数
  doc_expired_soon_cnt|doc|证照临期数|int|>=0|距受理日 ≤30 天到期、尚未过期的项数（只提示）
  doc_inconsist_name_cnt|doc|姓名矛盾处数|int|>=0|申请人署名材料之间的姓名不一致处数
  doc_inconsist_idno_cnt|doc|证件号矛盾处数|int|>=0|申请人署名材料之间的证件号不一致处数
  doc_inconsist_amount_cnt|doc|金额矛盾处数|int|>=0|合同/评估值/农机合同金额与申报额度不一致处数
  doc_inconsist_area_cnt|doc|面积矛盾处数|int|>=0|权证/项目计划书面积与申报面积不一致处数
  doc_inconsist_date_cnt|doc|日期矛盾处数|int|>=0|签订日晚于放款日等日期倒挂处数
  doc_sign_missing_cnt|doc|缺签章项数|int|>=0|已提交的应签章材料中签章不齐的项数
  doc_unknown_type_cnt|doc|清单外材料数|int|>=0|doc[].type 不在必备材料清单内的项数（不计缺件）
  doc_land_area_dev|doc|权证面积偏差|float|>=0|abs(权证面积-申报面积)/申报面积；申报面积为空时为 None
  doc_interview_missing|doc|面谈记录未留痕|bool|0/1|贷前未提交面谈记录及影像（2020办法第十八条）
  doc_first_check_overdue_days|doc|首贷检查超期天数|int|>=0|首次贷后检查晚于放款后 3 个月的天数（2020贷后办法第十五条）
  doc_onsite_check_shortfall|doc|现场检查次数缺口|int|>=0|按规定频次应做次数 - 已提交检查记录数（2020贷后办法第二十一条）
  doc_entrust_amt_short|doc|受托支付金额不足|bool|0/1|购销/订单合同金额低于本次提款额（2020办法第二十五条）

  # ── dim=cash 流水分析 ──────────────────────────────────────────
  inc_mean|money|月均入账|float|元|统计期内月均入账金额（剔除互转/冲正）
  inc_cv|float|收入变异系数|float|>=0|月入账标准差 / 月均入账；>0.5 视为不稳
  gap_cnt|cash|断档月数|int|>=0|连续无入账 >=1 个自然月的次数
  top1_share|cash|最大对手占比|float|0-1|单一交易对手入账额 / 总入账额
  in_out_ratio|cash|进出比|float|>=0|统计期总入账 / 总出账
  bal_min|cash|最低余额|float|元|统计期内最低日终余额
  loan_use_dev|cash|用途偏离度|float|0-1|与申报用途无关的大额出账占比
  night_txn_share|cash|非经营时段占比|float|0-1|22:00-06:00 交易笔数占比
  cash_inc_ratio|cash|现金入账占比|float|0-1|现金存入 / 总入账；过高说明收入难验证
  # ── 以下 9 个 cash 短码由严军超在规则扩容时按需新增，已用于 R113-R124。
  #    契约 IF-4.2 规定新增短码需李昊霖评审；评审通过前请勿在其他 skill 的 cond 中引用。
  #    取值口径全部写在 skills/sk_cash/references/流水分析要点.md（要点1/3/4/7/8/10）。
  seasonal_flag|cash|季节性经营标记|bool|0/1|经营品类属于季节性农业（种植/养殖等）时为1；industry缺失默认0
  top1_debit_share|cash|最大对手出账占比|float|0-1|单一交易对手出账额 / 总出账额；无出账时为 None
  n_txn|cash|有效交易笔数|int|>=0|剔除内部交易（互转/冲正/利息/退款）后的交易笔数
  txn_per_month|cash|月均交易笔数|float|>=0|有效交易笔数 / 统计期月数
  large_in_share|cash|单笔最大入账占比|float|0-1|单笔最大入账额 / 总入账额；无入账时为 None
  p2p_cnt|cash|民间借贷往来对手数|int|>=0|交易对手命中网贷/民间借贷关键词的个数
  large_cash_out|cash|大额现金取现笔数|int|>=0|渠道为现金且出账>=5000元的笔数
  round_trip_cnt|cash|当日等额对敲次数|int|>=0|同一自然日内入账与出账金额相等（差<1元）的对数
  recent_in_ratio|cash|近期入账比|float|>=0|最近2个完整月入账 / 更早2个完整月入账；不足4个月或更早期无入账时为 None

  # ── dim=cred 征信负债 ──────────────────────────────────────────
  dti|cred|债务收入比|float|0-1|月均还款额 / 月均收入
  multi_lend|cred|多头借贷家数|int|>=0|非银+同业在贷机构数
  overdue_24m|cred|近24月逾期次数|int|>=0|征信报告逾期次数合计
  overdue_max_days|cred|最长逾期天数|int|>=0|单次最长逾期天数
  query_3m|cred|近3月查询次数|int|>=0|贷款审批/信用卡审批类查询次数
  guarantee_bal|cred|对外担保余额|float|元|对外担保未结清金额（或有负债）
  card_util|cred|贷记卡使用率|float|0-1|已用额度 / 总授信额度
  credit_hist_len|cred|信用历史长度|int|月|首贷至今月数
  settled_recent|cred|近期结清异常|bool|0/1|放款前 3 月内集中结清大额贷款
  # ── 以下 20 个短码由邱家杰在规则扩容时按需新增，已用于 R214-R241。
  #    契约 IF-4.2 规定新增短码需李昊霖评审；评审通过前请勿在其他 skill 的 cond 中引用。
  overdue_cur|cred|当前逾期笔数|int|>=0|征信报告中当前逾期未结清的账户笔数
  bad_debt_flag|cred|呆账代偿标记|bool|0/1|存在呆账/代偿/核销记录
  dishonest_flag|cred|失信被执行标记|bool|0/1|被列入失信被执行人名单
  lawsuit_flag|cred|未结诉讼标记|bool|0/1|存在未结诉讼或执行案件
  card_cnt|cred|贷记卡账户数|int|>=0|征信报告中贷记卡账户总数（含准贷记卡）
  query_self_3m|cred|近3月本人查询次数|int|>=0|本人临柜/线上自助查询次数（非审批类）
  new_loan_3m|cred|近3月新增贷款笔数|int|>=0|近 3 个月新发放贷款笔数
  new_loan_amt_3m|cred|近3月新增贷款额|money|元|近 3 个月新发放贷款合同金额合计
  settled_amt_recent|cred|放款前结清金额|money|元|本次申请前 3 月内集中结清的贷款金额合计
  unsecured_ratio|cred|信用类负债占比|float|0-1|信用/保证类在贷余额 / 在贷总余额；无余额明细时为 None
  short_term_ratio|cred|短期负债占比|float|0-1|剩余期限 <=12 月在贷余额 / 在贷总余额；无期限明细时为 None
  guarantee_cnt|cred|对外担保笔数|int|>=0|对外担保未结清笔数
  co_borrower_debt|cred|共借人负债余额|money|元|共同借款人（配偶/合伙人）名下限有负债余额合计
  guarantee_overdue_flag|cred|被担保债务逾期|bool|0/1|本户对外担保的债务已发生逾期或代偿
  co_borrower_dishonest|cred|共借人失信标记|bool|0/1|共同借款人被列入失信被执行人名单
  five_level_bad|cred|非正常类贷款|bool|0/1|存在关注/次级/可疑/损失类贷款
  extension_cnt|cred|展期借新次数|int|>=0|历史展期或借新还旧累计次数
  semi_card_overdraft|cred|准贷记卡透支|bool|0/1|准贷记卡透支超过 60 天未还
  new_org_6m|cred|近6月新增授信机构|int|>=0|近 6 个月新发生授信的机构家数
  refinance_flag|cred|以贷还贷用途|bool|0/1|本次申报用途为偿还他行贷款或置换旧债

  # ── dim=x 跨域（仅 sk_rules 可引用）────────────────────────────
  declared_inc|money|申报收入|float|元|申请表/收入证明申报的月收入
  income_est|money|流水估算收入|float|元|由 cash 维度测算的经营净收入
  inc_gap_ratio|x|申报流水差异比|float|>=0|declared_inc / income_est
  total_debt|x|总负债|float|元|征信在贷余额 + guarantee_bal
  collat_ratio|x|抵押覆盖率|float|>=0|抵押物评估值 / 申请额度
  doc_risk_link|x|缺件风险映射|bool|0/1|doc_miss_cnt 是否命中准入类缺件清单
  dim_conflict|x|维度结论冲突|bool|0/1|两个及以上 skill 对同一事实给出不同判定

  # ── dim=ew 贷后预警 ────────────────────────────────────────────
  overdue_days|ew|当前逾期天数|int|>=0|当前逾期天数，0 表示正常
  repay_delay_cnt|ew|还款延迟次数|int|>=0|历史延迟还款（未逾期）次数
  bal_drop|ew|余额下降率|float|0-1|(上期余额-本期余额)/上期余额，提前还款除外
  use_dev_flag|ew|用途偏离标记|bool|0/1|贷后资金流向与约定用途不符
  biz_abnormal|ew|经营异常标记|bool|0/1|歇业/注销/涉诉/行政处罚
  contact_fail|ew|失联标记|bool|0/1|连续 2 次回访未取得有效联系
  natural_disaster|ew|受灾标记|bool|0/1|所在地发生气象/病虫害灾害
  price_shock|ew|价格冲击标记|bool|0/1|主营农产品价格同比跌幅超阈值
  guarantee_deplete|ew|担保弱化标记|bool|0/1|抵押物贬值/保证人代偿能力下降
  # ── 以下 ew 短码由真超奇在规则扩容时按需新增，已用于 E012-E050。
  #    契约 IF-4.2 规定新增短码需李昊霖评审；评审通过前请勿在其他 skill 的 cond 中引用。
  #    前 7 个是时序派生量（由 scripts/ew.py trend 算出），其余是 monitor_ts[] 的每时点字段。
  #    信号定义、触发阈值与处置口径见 skills/sk_ew/references/贷后预警信号.md（§3、§5）。
  signal_streak|ew|信号连续时点数|int|>=0|该规则所属信号已连续出现的监测时点数（由 ew.py 按 basis 注入）
  overdue_band_crossed|ew|逾期跨档标记|bool|0/1|最新时点逾期档位升到「次级」及以上（越过 31 天线）
  n_ts|ew|监测时点数|int|>=0|monitor_ts[] 的时点总数
  ew_max_streak|ew|最长连续时点数|int|>=0|最新时点仍成立的信号中，连续出现时点数的最大值
  ew_upgrade_cnt|ew|已升级信号数|int|>=0|状态为「升级」的信号个数（连续≥3 时点或跨档）
  ew_force_cnt|ew|强制处置信号数|int|>=0|连续 ≥3 个时点仍成立的信号个数（信号表 §3.1）
  ew_release_cnt|ew|拟解除信号数|int|>=0|最近 ≥2 个时点未出现、待人工确认的信号个数（§3.2）
  collateral_value_drop|ew|押品估值降幅|float|0-1|押品估值较放款时下降比例
  other_bank_overdue|ew|他行新增逾期|bool|0/1|他行新增逾期或本行风险分类下调
  account_frozen_flag|ew|账户冻结标记|bool|0/1|结算账户被冻结或止付
  check_overdue_days|ew|首贷检查超期天数|int|>=0|首次贷后检查超出发放后 3 个月的天数
  impersonation_flag|ew|冒顶名贷款|bool|0/1|冒顶名贷款（本人未申请或未使用）
  multi_borrow_one_use|ew|多人承贷一人用|bool|0/1|违规多人承贷一人使用
  company_use_personal|ew|个人承贷公司用|bool|0/1|违规个人承贷公司使用
  aml_level_up|ew|洗钱风险等级升高|bool|0/1|洗钱风险等级升高
  illegal_fundraise_flag|ew|民间借贷非法集资|bool|0/1|借款人及家庭成员从事民间借贷、非法集资或涉黑涉恶
  repay_by_new_loan|ew|借新还旧迹象|bool|0/1|以贷还贷/借新还旧迹象
  fund_backflow_flag|ew|资金回流关联方|bool|0/1|贷款资金回流借款人或其关联方
  split_disburse_flag|ew|化整为零支付|bool|0/1|化整为零规避受托支付
  forbidden_use_flag|ew|流入禁止领域|bool|0/1|资金流入房地产、股市、理财等禁止领域
  litigation_flag|ew|涉诉或被执行|bool|0/1|涉诉或被列为被执行人
  guarantor_ability_down|ew|保证人代偿力下降|bool|0/1|保证人代偿能力下降
  joint_guarantee_risk|ew|联保体成员出险|bool|0/1|联保体成员出险
  new_multi_lend_post|ew|贷后新增多头家数|int|>=0|贷后新增多头借贷家数
  collateral_disposed_flag|ew|押品被擅自处置|bool|0/1|抵质押物被擅自赠与、转让、再抵押
  convicted_flag|ew|家庭成员被判刑|bool|0/1|借款人及家庭成员从事违法犯罪活动被判刑
  check_freq_shortfall|ew|检查频次缺口|int|>=0|贷后现场检查次数低于规定频次的差额
  biz_idle_flag|ew|经营场所闲置停产|bool|0/1|经营场所闲置或停产
  penalty_flag|ew|受到行政处罚|bool|0/1|受到行政处罚
  family_change_flag|ew|家庭主要成员变故|bool|0/1|家庭主要成员重大变故
  staff_drop_ratio|ew|用工规模降幅|float|0-1|用工规模下降比例
  mortgage_reg_expired|ew|抵押登记失效|bool|0/1|抵押登记失效或未续登
  epidemic_flag|ew|重大动物疫情|bool|0/1|所在地发生重大动物疫情
  policy_shock_flag|ew|产业政策调整|bool|0/1|产业政策或禁养区调整
  agri_insurance_lapse|ew|农业保险失效|bool|0/1|农业保险失效或未续保
  upstream_down_flag|ew|上下游经营恶化|bool|0/1|上下游客户经营恶化
  refuse_check_flag|ew|拒绝配合检查|bool|0/1|拒绝或阻挠贷后检查
  query_surge_post|ew|贷后查询骤增|bool|0/1|贷后征信查询异常骤增
  # ── 以下 4 个 ew 短码来自《农户贷款风险线索核查处置操作规程（试行）》
  #    农银规章〔2020〕70号 第八条的风险线索分级；110号第十六条点名该规程。
  #    由**系统线索**下发（不是客户经理回访判断），逐时点给。
  multi_loan_same_account|ew|多户资金流向同账户|bool|0/1|多户贷款资金流向同一账户（关注类线索）
  multi_loan_same_repay|ew|多户同账户还款|bool|0/1|多户贷款由同一账户还款（关注类线索）
  batch_cash_repay|ew|批量现金还款|bool|0/1|短期内批量以现金方式还款（关注类线索）
  staff_client_fund|ew|员工客户资金往来|bool|0/1|本行员工与客户发生资金往来（重大类线索）

# 阈值分组：同一口径在不同环节的取值差异（供 stage_adaptation 引用）
thresholds: |
  # 变量|贷前|贷中|贷后
  inc_cv|0.5|0.5|0.7
  dti|0.5|0.55|0.6
  top1_share|0.6|0.6|0.7
  query_3m|6|8|-
  card_util|0.8|0.85|0.9
