# 规则库 · 单一事实来源（SSOT）
# 契约：IF-4。表驱动编码，一行一条。
# 构建期由 build/distribute_rules.py 按 owner 列切片分发到各 zip，
# 由 build/check_closure.py 校验闭包完整性。
#
# ⚠ 本文件不打包。各 skill 只拿到 rules.closure.md（本包闭包内的切片）。
# ⚠ 修改本文件后必须重跑 build/pack.py，否则各包规则会漂移。

version: 1.0.0
contract: v1
owner_default: sk_rules

columns: id|dim|cond|level|title|advice|basis|owner

# 跨维度输入白名单：这些变量由主智能体直接下发，任何 skill 均可引用。
# 白名单之外的变量只能来自本 skill 自己的计算，或上游 skill 的输出键。
shared_inputs: |
  declared_inc   # 申请表申报月收入，主智能体下发
  stage          # 环节（贷前/贷中/贷后）

# 计算依赖：cond 中出现的变量若不在本 skill 能力内，必须由这些上游提供。
# 校验脚本据此判断"某规则的 owner 能否独立求值"。
upstream: |
  income_est     <- sk_cash
  total_debt     <- sk_cred
  inc_gap_ratio  <- 由 declared_inc 与 income_est 派生，仅 sk_rules 可算
  collat_ratio   <- 由主智能体下发抵押物评估值与申请额度
  dim_conflict   <- sk_rules 内部产生
  doc_risk_link  <- sk_rules 内部产生（需 doc 维度 findings）

rules: |
  # 列序： id|dim|cond|level|title|advice|basis|owner
  # title 是风险点名称（名词短语，≤12字），advice 是处置建议（动词短语）。

  # ── dim=doc · owner=sk_doc ────────────────────────────────────
  # basis 一律引 《必备材料清单》 §7 的靶子编号（旧版引的「资料核查要点N」
  # 指向一份从未写出的文件，是悬空引用；2026-10-09 补齐参考资料时一并订正）。
  R001|doc|doc_miss_cnt>=3|高|材料大量缺失|暂缓受理并补齐材料|必备材料清单7-1|sk_doc
  R002|doc|doc_miss_cnt>=1 && doc_miss_cnt<=2|中|材料部分缺失|限期补齐缺件|必备材料清单7-2|sk_doc
  R003|doc|doc_expired_cnt>=1|中|证照过期|更换有效证照|必备材料清单7-14|sk_doc
  R004|doc|doc_inconsist_cnt>=1|高|材料相互矛盾|核实材料矛盾项|必备材料清单7-18|sk_doc
  R005|doc|id_valid==0|高|身份证核验不通过|重新核验身份|必备材料清单7-25|sk_doc
  R006|doc|land_right_match==0|高|土地权属与申报不符|核实土地权属|必备材料清单7-26|sk_doc
  R007|doc|sign_complete==0|中|签章不完整|补签章后受理|必备材料清单7-28|sk_doc
  R008|doc|doc_inconsist_cnt>=3|高|材料系统性矛盾|全面复核申请材料|必备材料清单7-19|sk_doc

  # ── dim=doc 扩容 · owner=sk_doc（真超奇补，8 → 36 条）────────────
  # 设计要点：**同一变量只给一个等级**（R001 已把 doc_miss_cnt>=3 判高，
  # 就不再在同一个变量上再开一条不同等级的规则——那会被
  # build/check_rule_conflicts.py 的 D2 判成"同一现象两个等级"）。
  # 因此扩容主要靠**按类别/比对项拆变量**，而不是把阈值切得更碎。
  # 缺件类
  R009|doc|doc_miss_redline_cnt>=3|高|多份准入要件缺失|暂缓受理并补齐材料|必备材料清单7-4|sk_doc
  R010|doc|doc_miss_identity_cnt>=1|中|身份类要件缺失|限期补齐身份材料|必备材料清单7-5|sk_doc
  R011|doc|doc_miss_income_cnt>=1|中|收入要件缺失|补充收入证明材料|必备材料清单7-6|sk_doc
  R012|doc|doc_miss_use_cnt>=1|中|用途材料缺失|补充用途证明材料|必备材料清单7-7|sk_doc
  R013|doc|doc_miss_guarantee_cnt>=2|中|担保要件缺失|限期补齐担保材料|必备材料清单7-8|sk_doc
  R014|doc|doc_miss_guarantee_cnt==1|低|担保材料不全|提示补齐担保材料|必备材料清单7-9|sk_doc
  R015|doc|doc_miss_biz_cnt>=2|中|经营要件缺失|补充经营类证明材料|必备材料清单7-10|sk_doc
  R016|doc|doc_miss_contract_cnt>=1|高|合同支付要件缺失|补齐合同支付要件|必备材料清单7-11|sk_doc
  R017|doc|doc_miss_postcheck_cnt>=1|中|贷后检查材料缺失|限期补齐检查记录|必备材料清单7-12|sk_doc
  R018|doc|doc_miss_archive_cnt>=1|低|归档材料缺失|及时归档贷后材料|必备材料清单7-13|sk_doc
  R019|doc|doc_miss_cnt>=6|高|材料严重缺失|暂缓受理并全面复核|必备材料清单7-3|sk_doc
  # 时效类
  R020|doc|doc_expired_key_cnt>=2|高|关键证照多份过期|更换有效证照后受理|必备材料清单7-15|sk_doc
  R021|doc|doc_expired_key_cnt==1|中|关键证照过期|更换有效证照|必备材料清单7-16|sk_doc
  R022|doc|doc_expired_soon_cnt>=1|低|证照临期提示|提示及时换发证照|必备材料清单7-17|sk_doc
  # 一致性类（按比对项拆开：总项数给不了处置动作，拆开才知道该找谁核）
  R023|doc|doc_inconsist_name_cnt>=1|高|姓名不一致|核实并更正姓名|必备材料清单7-20|sk_doc
  R024|doc|doc_inconsist_idno_cnt>=1|高|证件号不一致|核实并更正证件号|必备材料清单7-21|sk_doc
  R025|doc|doc_inconsist_amount_cnt>=1|高|合同金额不一致|核实合同金额一致性|必备材料清单7-22|sk_doc
  R026|doc|doc_inconsist_area_cnt>=1|中|权证面积不一致|核实申报面积与权证|必备材料清单7-23|sk_doc
  R027|doc|doc_inconsist_date_cnt>=1|中|材料日期矛盾|核实材料日期逻辑|必备材料清单7-24|sk_doc
  # 形式类
  R028|doc|doc_sign_missing_cnt>=2|中|多份材料缺签章|补签并完善签章|必备材料清单7-29|sk_doc
  R029|doc|doc_unknown_type_cnt>=1|低|存在清单外材料|人工确认材料类型|必备材料清单7-30|sk_doc
  R030|doc|doc_land_area_dev>0.03 && doc_land_area_dev<=0.05|低|面积接近容差|复核权证面积偏差|必备材料清单7-27|sk_doc
  # 流程合规类（行内制度有明文期限，见 §5.1）
  R031|doc|doc_interview_missing==1|中|面谈记录未留痕|补做面谈并留痕|必备材料清单7-31|sk_doc
  R032|doc|doc_first_check_overdue_days>0 && doc_first_check_overdue_days<=30|中|首贷检查超期|限期补做首次检查|必备材料清单7-32|sk_doc
  R033|doc|doc_first_check_overdue_days>30|高|首贷检查严重超期|立即补做首次检查|必备材料清单7-33|sk_doc
  R034|doc|doc_onsite_check_shortfall==1|中|现场检查未达频次|限期补做现场检查|必备材料清单7-34|sk_doc
  R035|doc|doc_onsite_check_shortfall>=2|高|现场检查严重不足|立即补做并追究责任|必备材料清单7-35|sk_doc
  R036|doc|doc_entrust_amt_short==1|高|受托支付金额不足|补足受托支付凭证|必备材料清单7-36|sk_doc

  # ── dim=cash · owner=sk_cash ──────────────────────────────────
  R101|cash|inc_cv>0.5 && gap_cnt>=3|高|收入波动叠加断档|核实收入波动原因|流水分析要点3|sk_cash
  R102|cash|inc_cv>0.5|中|收入稳定性不足|关注收入稳定性|流水分析要点3|sk_cash
  R103|cash|gap_cnt>=3|中|经营连续性中断|核实经营连续性|流水分析要点4|sk_cash
  # 分档原则：同一变量只用互不重叠的区间分档（金宇桐复审项）。
  # R104 原为 top1_share>0.6，与 R105（>0.85 高）区间嵌套 → 同一现象出现"中+高"两个等级；
  # 现收窄到 (0.6, 0.85]，与 R105 互补。经 eval/contract_tests.py 验证行为不变
  # （冒烟 fixture 的 top1_share≈0.607，仍命中 R104 且不命中 R105）。
  R104|cash|top1_share>0.6 && top1_share<=0.85|中|交易对手集中|核实主要交易对手|流水分析要点7|sk_cash
  R105|cash|top1_share>0.85|高|单一对手高度依赖|核实对手依赖风险|流水分析要点7|sk_cash
  R106|cash|loan_use_dev>0.3|高|资金用途偏离|核实资金真实去向|流水分析要点11|sk_cash
  R107|cash|in_out_ratio<0.9|中|资金净流出|核实经营现金流|流水分析要点5|sk_cash
  R108|cash|bal_min<=0|高|账户曾透支|核实账户透支原因|流水分析要点6|sk_cash
  R109|cash|night_txn_share>0.3|低|非经营时段交易偏多|留意交易时段异常|流水分析要点9|sk_cash
  R110|cash|cash_inc_ratio>0.7|中|现金收入占比过高|核实现金收入来源|流水分析要点10|sk_cash
  R111|cash|inc_cv>0.7 && top1_share>0.7|高|收入不稳且对手单一|核实收入可持续性|流水分析要点3+7|sk_cash
  R112|cash|loan_use_dev>0.1 && loan_use_dev<=0.3|中|资金用途轻微偏离|补充用途说明|流水分析要点11|sk_cash

  # ── dim=cred · owner=sk_cred ──────────────────────────────────
  R201|cred|dti>0.55|高|负债率超限|压降额度或追加担保|征信审查要点2|sk_cred
  R202|cred|dti>0.5 && dti<=0.55|中|负债率偏高|关注还款压力|征信审查要点2|sk_cred
  R203|cred|multi_lend>=4|高|多头借贷|核实多头融资用途|征信审查要点9|sk_cred
  R204|cred|multi_lend>=2 && multi_lend<=3|中|存在多头借贷迹象|关注新增融资|征信审查要点9|sk_cred
  R205|cred|overdue_max_days>=90|高|严重逾期历史|审慎准入|征信审查要点4|sk_cred
  R206|cred|overdue_max_days>=30 && overdue_max_days<90|中|逾期超30天|核实逾期原因|征信审查要点4|sk_cred
  R207|cred|overdue_24m>=3|中|逾期频次偏高|关注还款意愿|征信审查要点4|sk_cred
  R208|cred|query_3m>=8|高|征信查询异常|核实集中申贷原因|征信审查要点11|sk_cred
  R209|cred|query_3m>=6 && query_3m<8|中|征信查询偏多|关注融资需求|征信审查要点11|sk_cred
  R210|cred|card_util>0.85|中|贷记卡高使用率|核实流动性状况|征信审查要点7|sk_cred
  R211|cred|guarantee_bal>declared_inc*6|高|对外担保过重|核实或有负债|征信审查要点13|sk_cred
  R212|cred|credit_hist_len<12|中|信用历史过短|参考替代数据|征信审查要点3|sk_cred
  R213|cred|settled_recent==1|中|放款前集中结清|核实结清资金来源|征信审查要点15|sk_cred

  # ── dim=cred 扩容 · owner=sk_cred（邱家杰补，13 → 41 条）──────
  # 编码口径：阈值按**贷中（审批）**口径编码，与 dict.yaml thresholds 的"贷中"列一致。
  # 贷前从严 / 贷后放宽由 sk_rules 结合 factors 与 thresholds 调整，本维度不自动改写规则。
  # 分档原则：同一变量只用**互不重叠**的区间分档（如 R224 >0.9 高 / R225 0.7-0.9 中），
  # 禁止出现两条规则对同一区间给出不同等级（金宇桐审核项）。
  # R214 加 overdue_cur==0：否则与 R215（overdue_cur>=1 高）对**同一笔当前逾期**
  # 同时命中，同一事实出现"低+高"两个等级。加此限定后 R214 只管"历史已结清的短期逾期"。
  # 副作用：overdue_cur 缺失时 R214 被跳过（标 partial），符合"缺数据不猜"原则。
  R214|cred|overdue_max_days>=1 && overdue_max_days<30 && overdue_cur==0|低|短期逾期记录|记录备查并提示客户|征信审查要点4|sk_cred
  R215|cred|overdue_cur>=1|高|当前存在逾期|结清后方可准入|征信审查要点4|sk_cred
  R216|cred|bad_debt_flag==1|高|存在呆账或代偿|一票否决并拒贷|征信审查要点5|sk_cred
  # R217 原 advice 为"一票否决并拒贷"，与法释〔2017〕7号冲突（该规定设 2 年纳入期限、
  # 4 种不得纳入情形、7 种应删除情形，不存在"法定禁入"）。改为要求核实状态与期限。
  R217|cred|dishonest_flag==1|高|失信被执行人|核实失信状态与期限|征信审查要点6|sk_cred
  R218|cred|lawsuit_flag==1|中|存在未结诉讼|核实诉讼进展|征信审查要点6|sk_cred
  R219|cred|card_cnt>=6|中|贷记卡账户过多|核实授信总额|征信审查要点7|sk_cred
  R220|cred|query_self_3m>=6|低|本人查询过频|关注融资焦虑|征信审查要点11|sk_cred
  R221|cred|new_loan_3m>=3|高|近期集中新增贷款|核实新增融资用途|征信审查要点10|sk_cred
  R222|cred|new_loan_3m>=1 && new_loan_3m<=2|中|近期存在新增贷款|关注融资节奏|征信审查要点10|sk_cred
  R223|cred|new_loan_amt_3m>declared_inc*12|高|新增负债超年收入|核实资金缺口|征信审查要点10|sk_cred
  R224|cred|unsecured_ratio>0.9|高|负债几乎无抵押|追加抵押或压降|征信审查要点12|sk_cred
  R225|cred|unsecured_ratio>0.7 && unsecured_ratio<=0.9|中|信用类负债偏高|关注负债结构|征信审查要点12|sk_cred
  R226|cred|short_term_ratio>0.7|中|短期负债占比过高|关注续贷依赖|征信审查要点12|sk_cred
  R227|cred|guarantee_bal>declared_inc*3 && guarantee_bal<=declared_inc*6|中|对外担保偏重|核实或有负债|征信审查要点13|sk_cred
  R228|cred|guarantee_cnt>=3|中|担保笔数偏多|核实担保对象|征信审查要点13|sk_cred
  R229|cred|co_borrower_debt>declared_inc*12|高|共借人负债过重|合并评估还款能力|征信审查要点14|sk_cred
  R230|cred|co_borrower_debt>declared_inc*6 && co_borrower_debt<=declared_inc*12|中|共借人负债偏高|合并测算家庭负债|征信审查要点14|sk_cred
  R231|cred|settled_amt_recent>new_loan_amt_3m && new_loan_amt_3m>0|高|疑似以贷养贷|核实结清资金来源|征信审查要点15|sk_cred
  R232|cred|credit_hist_len>=12 && credit_hist_len<24|低|信用历史偏短|参考替代数据|征信审查要点3|sk_cred
  R233|cred|card_util>0.7 && card_util<=0.85|低|贷记卡使用率偏高|关注卡债水平|征信审查要点7|sk_cred
  R234|cred|guarantee_overdue_flag==1|高|被担保债务已逾期|关注代偿风险|征信审查要点13|sk_cred
  R235|cred|co_borrower_dishonest==1|高|共同借款人失信|合并认定失信|征信审查要点14|sk_cred
  R236|cred|five_level_bad==1|高|存在非正常类贷款|核实五级分类|征信审查要点8|sk_cred
  R237|cred|extension_cnt>=1 && extension_cnt<=2|中|存在展期记录|核实展期原因|征信审查要点8|sk_cred
  R238|cred|extension_cnt>=3|高|频繁借新还旧|审慎准入|征信审查要点8|sk_cred
  R239|cred|semi_card_overdraft==1|高|准贷记卡透支超限|核实透支情况|征信审查要点7|sk_cred
  R240|cred|new_org_6m>=3|中|近半年新增授信机构|关注负债扩张|征信审查要点9|sk_cred
  R241|cred|refinance_flag==1|高|本次用途为以贷还贷|核实真实用途|征信审查要点15|sk_cred

  # ── dim=cred 扩容二 · 查询原因分布（分工.md 任务3 点名的缺口）──────────
  # 人行官方对"查询次数多"的风险解释是**查询多但没有获批**（"…多次被不同的银行查询，
  # 但…没有得到新贷款…可能会产生不利影响"，见要点11）。所以这两条把"次数"与"结果"
  # 合起来看，补上纯次数阈值给不出的语义（被多家机构拒绝）。
  # 等级与 R208/R209 保持一致（不升级），只让 title/advice 更准确——避免制造等级冲突。
  R242|cred|query_3m>=6 && query_3m<8 && new_loan_3m==0|中|申贷集中但未获批|核实被拒原因|征信审查要点11|sk_cred
  R243|cred|query_3m>=8 && new_loan_3m==0|高|集中申贷均未获批|核实被拒原因|征信审查要点11|sk_cred

  # ── dim=x 跨域 · owner=sk_rules（仅此处可做跨维度判定）─────────
  X001|x|inc_gap_ratio>1.5|高|申报收入高于流水测算|核实收入真实性|交叉验证规则1|sk_rules
  X002|x|inc_gap_ratio<0.6|中|申报收入低于流水测算|复核申报口径|交叉验证规则1|sk_rules
  X003|x|total_debt>income_est*24|高|总负债超年收入两倍|压降负债或追加担保|交叉验证规则2|sk_rules
  X004|x|collat_ratio<1.0|高|抵押覆盖不足|追加担保或压降额度|交叉验证规则4|sk_rules
  X005|x|collat_ratio>=1.0 && collat_ratio<1.3|中|抵押覆盖偏低|关注押品价值波动|交叉验证规则4|sk_rules
  X006|x|dim_conflict==1|高|维度结论冲突|人工复核冲突结论|交叉验证规则6|sk_rules
  X007|x|doc_risk_link==1|高|缺件触及准入红线|补齐红线材料|交叉验证规则3|sk_rules
  X008|x|inc_gap_ratio>1.5 && dti>0.5|高|收入虚高叠加高负债|审慎准入|交叉验证规则1+2|sk_rules

