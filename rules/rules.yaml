# 等级合成规则（仅 sk_rules 使用，契约 D2）
# 输入：全部 finding 的 level 集合  →  输出：整体 risk.level
level_synthesis: |
  任一条 高            => 整体 高
  仅 中（无高）        => 整体 中
  仅 低 / 无 finding   => 整体 低
  冲突消解：同 id 多条 finding 取最高 level；dim_conflict 存在时强制 高
  置信度：任一命中规则 conf<0.6 时，整体等级标注"待核实"后缀

# 内联 top-N：这些规则直接写进对应 skill.md 正文，保证"没工具也能跑"
# 选入标准：高频命中 或 是等级判定的关键路径
inline_topn: |
  R001,R004,R005,R006,R101,R105,R106,R108,R201,R203,R205,R208,R215,R216,R217,X001,X004,E002,E004,E005
